server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Matches the backend's MAX_TOTAL_SIZE_MB default; the backend enforces the real limits.
    client_max_body_size 200m;

    # Set at server level only: an add_header inside a location would drop these.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # nginx buffers the whole upload and forwards it with a Content-Length, which the backend requires.
        proxy_request_buffering on;
        # Longer than the backend's 120 s Ghostscript timeout.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Vite's hashed bundles never change, so they can be cached forever.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Client-side routes (/merge, /compress, ...) all serve the SPA.
    location / {
        try_files $uri /index.html;
    }
}
