services:
  backend:
    build: ./backend
    environment:
      # Sized to fit mem_limit: at most 2 Ghostscript runs of 1 GB each, plus image jobs.
      MAX_CONCURRENT_COMPRESSIONS: "2"
      GS_MEMORY_LIMIT_MB: "1024"
      MAX_CONCURRENT_IMAGE_JOBS: "2"
    mem_limit: 4g
    # Bound to localhost only; the API docs are at http://localhost:8000/docs.
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=2g  # uploads and results are processed here
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=512m  # nginx pid file and buffered upload bodies
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
